{% extends "base.html" %}
{% block content %}
<h1>异常与维修管理</h1>
<div class="card">
    <h2>异常记录</h2>
    <table>
        <tr>
            <th>ID</th><th>区域</th><th>类型</th><th>等级</th><th>位置</th><th>描述</th><th>状态</th><th>维修处理</th>
        </tr>
        {% for a in abnormalities %}
        <tr>
            <td>{{ a.abnormal_id }}</td>
            <td>{{ a.area_name }}</td>
            <td>{{ a.abnormal_type }}</td>
            <td><span class="tag">{{ a.abnormal_level }}</span></td>
            <td>{{ a.location }}</td>
            <td>{{ a.description }}</td>
            <td><span class="tag">{{ a.status }}</span></td>
            <td>
                <details>
                    <summary>填写维修</summary>
                    <form method="post" action="{{ url_for('add_repair', abnormal_id=a.abnormal_id) }}">
                        <input name="repair_person" placeholder="维修人员" required>
                        <textarea name="repair_method" placeholder="处理方式" required></textarea>
                        <select name="repair_result">
                            <option>已完成</option><option>未完成</option>
                        </select>
                        <select name="review_status">
                            <option>通过</option><option>未通过</option>
                        </select>
                        <button>提交维修记录</button>
                    </form>
                </details>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
