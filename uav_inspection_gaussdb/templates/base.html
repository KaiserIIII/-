<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>{{ title or '无人机巡检任务管理系统' }}</title>
    <style>
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: #f4f7fb; color: #222; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 230px; background: #16233a; color: white; padding: 24px 16px; }
        .sidebar h2 { font-size: 19px; line-height: 1.5; margin: 0 0 24px; }
        .sidebar a { display: block; color: #dbe7ff; text-decoration: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; }
        .sidebar a:hover { background: #25395d; }
        .content { flex: 1; padding: 28px; }
        .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(30, 45, 80, .08); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        .stat { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(30, 45, 80, .08); }
        .stat .num { font-size: 30px; font-weight: bold; color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 11px 10px; border-bottom: 1px solid #e8edf5; text-align: left; font-size: 14px; }
        th { background: #eef4ff; }
        input, select, textarea { padding: 9px; border: 1px solid #ccd6e5; border-radius: 8px; margin: 4px 6px 10px 0; }
        textarea { width: 96%; min-height: 60px; }
        button { background: #1d4ed8; color: white; border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
        button:hover { background: #153eaa; }
        .flash { background: #fff7d6; border: 1px solid #f2d36b; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 99px; background: #e7efff; color: #1d4ed8; font-size: 12px; }
        .danger { color: #b91c1c; font-weight: bold; }
        .ok { color: #15803d; font-weight: bold; }
        .muted { color: #667085; font-size: 13px; }
    </style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <h2>高校园区<br>无人机巡检系统</h2>
        <a href="{{ url_for('dashboard') }}">首页仪表盘</a>
        <a href="{{ url_for('drones') }}">无人机管理</a>
        <a href="{{ url_for('batteries') }}">电池管理</a>
        <a href="{{ url_for('areas') }}">巡检区域管理</a>
        <a href="{{ url_for('tasks') }}">巡检任务调度</a>
        <a href="{{ url_for('abnormalities') }}">异常与维修管理</a>
    </div>
    <div class="content">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
