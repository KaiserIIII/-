{% extends "base.html" %}
{% block content %}
<h1>无人机管理</h1>
<div class="card">
    <h2>新增无人机</h2>
    <form method="post">
        <input name="drone_code" placeholder="设备编号 UAV006" required>
        <input name="model" placeholder="型号" required>
        <input name="max_flight_time" type="number" placeholder="最大续航分钟" required>
        <select name="status">
            <option>可用</option><option>使用中</option><option>维修中</option><option>报废</option>
        </select>
        <input name="purchase_date" type="date">
        <input name="last_maintenance_date" type="date">
        <button type="submit">添加</button>
    </form>
</div>
<div class="card">
    <h2>无人机列表</h2>
    <table>
        <tr>
            <th>ID</th><th>设备编号</th><th>型号</th><th>续航</th><th>状态</th><th>购买日期</th><th>最近保养</th><th>修改状态</th>
        </tr>
        {% for d in drones %}
        <tr>
            <td>{{ d.drone_id }}</td>
            <td>{{ d.drone_code }}</td>
            <td>{{ d.model }}</td>
            <td>{{ d.max_flight_time }} 分钟</td>
            <td><span class="tag">{{ d.status }}</span></td>
            <td>{{ d.purchase_date }}</td>
            <td>{{ d.last_maintenance_date }}</td>
            <td>
                <form method="post" action="{{ url_for('update_drone_status', drone_id=d.drone_id) }}">
                    <select name="status">
                        <option>可用</option><option>使用中</option><option>维修中</option><option>报废</option>
                    </select>
                    <button>更新</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
