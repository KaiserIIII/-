{% extends "base.html" %}
{% block content %}
<h1>巡检区域管理</h1>
<div class="card">
    <h2>新增巡检区域</h2>
    <form method="post">
        <input name="area_name" placeholder="区域名称" required>
        <select name="area_type">
            <option>建筑</option><option>道路</option><option>林区</option><option>施工区</option><option>消防通道</option><option>光伏设备区</option>
        </select>
        <select name="risk_level">
            <option>低</option><option>中</option><option>高</option>
        </select>
        <input name="inspection_cycle" type="number" placeholder="巡检周期/天" required>
        <textarea name="description" placeholder="区域说明"></textarea>
        <button type="submit">添加</button>
    </form>
</div>
<div class="card">
    <h2>区域列表</h2>
    <table>
        <tr><th>ID</th><th>区域名称</th><th>类型</th><th>风险等级</th><th>巡检周期</th><th>说明</th></tr>
        {% for a in areas %}
        <tr>
            <td>{{ a.area_id }}</td>
            <td>{{ a.area_name }}</td>
            <td>{{ a.area_type }}</td>
            <td><span class="tag">{{ a.risk_level }}</span></td>
            <td>{{ a.inspection_cycle }} 天</td>
            <td>{{ a.description }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
